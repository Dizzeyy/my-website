<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dizzeyy - writing fiction">
  <title>Dizzeyy — Writing Fiction</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,.06), transparent 30%),
        #17151b;
      color: #f5f0e8;
    }

    main {
      width: min(560px, 100%);
      text-align: center;
      padding: 64px 32px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      background: rgba(255,255,255,.045);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
    }

    .mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(245,240,232,.45);
      border-radius: 50%;
      font-size: 24px;
      font-style: italic;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 3.6rem);
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 12px 0 40px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: .95rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #c8c0b5;
    }

    a {
      display: inline-block;
      min-width: 190px;
      padding: 14px 24px;
      border: 1px solid rgba(245,240,232,.45);
      border-radius: 999px;
      color: #f5f0e8;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: .9rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: .2s ease;
    }

    a:hover {
      background: #f5f0e8;
      color: #17151b;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 42px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: .72rem;
      letter-spacing: .08em;
      color: #817a72;
    }
  </style>
</head>

<body>
  <main>
    <div class="mark">D</div>

    <h1>Dizzeyy</h1>
    <div class="subtitle">Writing Fiction</div>

    <!-- Replace the URL below with your actual Ream profile/page URL -->
    <a href="https://reamstories.com/page/msl4n32m70b0df/public" target="_blank" rel="noopener noreferrer">
      Read on Ream
    </a>

    <footer>
      dizzeyywrites.com
    </footer>
  </main>
</body>
</html>
